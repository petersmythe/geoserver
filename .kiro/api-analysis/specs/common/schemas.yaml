LayerResponse:
  type: object
  description: Response wrapper for a single layer
  properties:
    layer:
      type: object
      properties:
        name:
          type: string
          description: The name of the layer
        type:
          type: string
          enum: [VECTOR, RASTER, REMOTE, WMS, GROUP]
          description: The type of the layer
        defaultStyle:
          type: object
          properties:
            name:
              type: string
            href:
              type: string
              format: uri
        styles:
          type: object
          properties:
            "@class":
              type: string
            style:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  href:
                    type: string
                    format: uri
        resource:
          type: object
          properties:
            "@class":
              type: string
              description: Resource class (featureType or coverage)
            name:
              type: string
            href:
              type: string
              format: uri
        enabled:
          type: boolean
        queryable:
          type: boolean
        opaque:
          type: boolean
        attribution:
          type: object
          properties:
            logoWidth:
              type: integer
            logoHeight:
              type: integer
  example:
    layer:
      name: "roads"
      type: "VECTOR"
      defaultStyle:
        name: "line"
        href: "http://localhost:8080/geoserver/rest/styles/line.json"
      resource:
        "@class": "featureType"
        name: "roads"
        href: "http://localhost:8080/geoserver/rest/workspaces/sf/datastores/sf/featuretypes/roads.json"
      enabled: true
      queryable: true
      opaque: false

