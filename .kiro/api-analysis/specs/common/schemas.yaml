LayerGroupResponse:
  type: object
  description: Response wrapper for a single layer group
  properties:
    layerGroup:
      type: object
      properties:
        name:
          type: string
          description: The name of the layer group
        mode:
          type: string
          enum: [SINGLE, OPAQUE_CONTAINER, NAMED, CONTAINER, EO]
        title:
          type: string
        abstractTxt:
          type: string
        workspace:
          type: object
          properties:
            name:
              type: string
            href:
              type: string
              format: uri
        publishables:
          type: object
          properties:
            published:
              type: array
              items:
                type: object
                properties:
                  "@type":
                    type: string
                  name:
                    type: string
                  href:
                    type: string
                    format: uri
        styles:
          type: object
          properties:
            style:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  href:
                    type: string
                    format: uri
        bounds:
          type: object
          properties:
            minx:
              type: number
              format: double
            miny:
              type: number
              format: double
            maxx:
              type: number
              format: double
            maxy:
              type: number
              format: double
            crs:
              type: string
  example:
    layerGroup:
      name: "spearfish"
      mode: "SINGLE"
      title: "Spearfish"
      publishables:
        published:
          - "@type": "layer"
            name: "roads"
            href: "http://localhost:8080/geoserver/rest/layers/roads.json"
      bounds:
        minx: -180.0
        miny: -90.0
        maxx: 180.0
        maxy: 90.0
        crs: "EPSG:4326"

