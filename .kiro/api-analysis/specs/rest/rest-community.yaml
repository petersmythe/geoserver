components:
  schemas:
    TemplateInfoList:
      type: object
      description: List of feature template metadata entries
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateInfoEntry'
    TemplateInfoEntry:
      type: object
      description: Metadata for a single feature template
      properties:
        name:
          type: string
          description: The template name
        fileType:
          type: string
          description: File extension (json, xml, xhtml)
          enum:
            - json
            - xml
            - xhtml
        location:
          type: string
          format: uri
          description: URI to retrieve the template content
    TemplateRule:
      type: object
      description: A rule that maps a template to an output format for a feature type
      properties:
        ruleId:
          type: string
          description: Unique identifier for the rule (auto-generated on creation)
        priority:
          type: integer
          description: Rule priority (lower values have higher priority)
        templateName:
          type: string
          description: Full name of the template to apply
        templateIdentifier:
          type: string
          description: Internal identifier of the template
        outputFormat:
          type: string
          description: Output format this rule applies to
          enum:
            - GEOJSON
            - GML
            - JSONLD
            - HTML
        cqlFilter:
          type: string
          description: Optional CQL filter expression for conditional rule application
      required:
        - priority
    TemplateRuleList:
      type: object
      description: List of template rules for a feature type
      properties:
        Rules:
          type: array
          items:
            $ref: '#/components/schemas/TemplateRule'
    SchemaInfoList:
      type: object
      description: List of schema override metadata entries
      properties:
        schemas:
          type: array
          items:
            $ref: '#/components/schemas/SchemaInfoEntry'
    SchemaInfoEntry:
      type: object
      description: Metadata for a single schema override
      properties:
        name:
          type: string
          description: The schema override name
        fileType:
          type: string
          description: File extension (json, xml, xhtml)
          enum:
            - json
            - xml
            - xhtml
        location:
          type: string
          format: uri
          description: URI to retrieve the schema override content
    SchemaRule:
      type: object
      description: A rule that maps a schema override to an output format for a feature type
      properties:
        ruleId:
          type: string
          description: Unique identifier for the rule (auto-generated on creation)
        priority:
          type: integer
          description: Rule priority (lower values have higher priority)
        schemaName:
          type: string
          description: Full name of the schema override to apply
        schemaIdentifier:
          type: string
          description: Internal identifier of the schema override
        outputFormat:
          type: string
          description: Output format this rule applies to
          enum:
            - GEOJSON
            - GML
            - JSONLD
            - HTML
        cqlFilter:
          type: string
          description: Optional CQL filter expression for conditional rule application
      required:
        - priority
    SchemaRuleList:
      type: object
      description: List of schema rules for a feature type
      properties:
        Rules:
          type: array
          items:
            $ref: '#/components/schemas/SchemaRule'
