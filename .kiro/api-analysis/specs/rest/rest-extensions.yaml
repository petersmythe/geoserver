openapi: 3.0.0
info:
  title: GeoServer Extensions API
  version: 1.0.0
  description: REST API endpoints for extensions module
paths:
  /rest/metadata:
    delete:
      operationId: delete_metadata_MetaDataRestService_clearAll
      summary: Clear all metadata
      description: >-
        Clears all metadata from all layers. Optionally also removes metadata templates.
        Requires the iAmSure parameter to be true as a safety check.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: All metadata cleared successfully
        '400':
          description: Bad request — returned if iAmSure is not set to true
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: iAmSure
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: >-
          Safety check parameter. Must be set to true to actually clear metadata.
          If false or omitted, returns a 400 error.
      - name: templatesToo
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, also removes all metadata templates in addition to metadata values.
  /rest/metadata/customToNative:
    get:
      operationId: get_metadata_MetaDataRestService_customToNative
      summary: Convert custom metadata to native format
      description: >-
        Maps custom metadata fields to native resource properties for a specified layer.
        Reads the layer's custom metadata and writes corresponding native metadata fields,
        then saves the layer.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: Conversion completed successfully
          content:
            text/plain:
              schema:
                type: string
                example: Success.
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          description: Layer not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: layerName
        in: query
        required: true
        schema:
          type: string
        description: >-
          The fully-qualified layer name (e.g., "workspace:layername") to convert
          custom metadata to native format.
  /rest/metadata/fix:
    get:
      operationId: get_metadata_MetaDataRestService_fixAll
      summary: Fix metadata inconsistencies
      description: >-
        Scans all layers and fixes metadata inconsistencies. This re-applies template
        linkages and ensures metadata values are consistent with their templates.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: Fix operation completed successfully
          content:
            text/plain:
              schema:
                type: string
                example: Success.
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/metadata/import:
    post:
      operationId: post_metadata_MetaDataRestService_importAndLink
      summary: Import metadata from external source
      description: >-
        Imports metadata from a CSV file and links it to layers. The CSV file is provided
        as the request body. Optionally connects to a GeoNetwork instance to fetch
        additional metadata.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: Import completed successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: geonetwork
        in: query
        required: false
        schema:
          type: string
        description: >-
          URL of a GeoNetwork instance to fetch metadata from during import.
          If omitted, only the CSV data is used.
      requestBody:
        required: true
        description: CSV file content mapping layers to metadata records
        content:
          text/plain:
            schema:
              type: string
              description: CSV content with layer-to-metadata mappings
  /rest/metadata/linkedlayers:
    get:
      operationId: get_metadata_MetaDataRestService_getLinkedLayers
      summary: Get layers linked to a metadata template
      description: >-
        Returns a newline-separated list of layer names that are linked to the specified
        metadata template. Each line contains the prefixed layer name (workspace:layer)
        or the raw resource ID if the resource no longer exists in the catalog.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: List of linked layer names (newline-separated)
          content:
            text/plain:
              schema:
                type: string
                description: >-
                  Newline-separated list of layer names in workspace:layer format.
                example: |-
                  topp:states
                  sf:archsites
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: template
        in: query
        required: true
        schema:
          type: string
        description: The name of the metadata template to look up linked layers for.
  /rest/metadata/nativeToCustom:
    get:
      operationId: get_metadata_MetaDataRestService_nativeToCustom
      summary: Convert native metadata to custom format
      description: >-
        Converts native resource metadata fields to custom metadata format for all layers,
        or a subset specified by index. Reads native metadata properties and populates
        the corresponding custom metadata fields.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: Conversion completed successfully
          content:
            text/plain:
              schema:
                type: string
                example: Success.
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: indexes
        in: query
        required: false
        schema:
          type: string
        description: >-
          Comma-separated list of integer indexes specifying which mapping rules to apply.
          If omitted, all mapping rules are applied.
    post:
      operationId: post_metadata_MetaDataRestService_nativeToCustom
      summary: Trigger native-to-custom conversion with CSV mapping
      description: >-
        Converts native resource metadata to custom format using a CSV mapping file
        provided in the request body. Optionally limited to specific mapping indexes.
      tags:
      - Extensions - Metadata
      responses:
        '200':
          description: Conversion completed successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: indexes
        in: query
        required: false
        schema:
          type: string
        description: >-
          Comma-separated list of integer indexes specifying which mapping rules to apply.
          If omitted, all mapping rules are applied.
      requestBody:
        required: true
        description: CSV file content defining the native-to-custom field mappings
        content:
          text/plain:
            schema:
              type: string
              description: CSV content with field mapping definitions
  /rest/geofence/adminrules:
    get:
      operationId: get_geofence_AdminRulesRestController_get
      summary: List geofence admin rules
      description: >-
        Returns a list of admin rules, optionally filtered by user, role, or workspace.
        Admin rules control administrative access (ADMIN or USER grant) to workspaces.
      tags:
      - Extensions
      responses:
        '200':
          description: List of admin rules matching the filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number for pagination (0-based)
      - name: entries
        in: query
        required: false
        schema:
          type: integer
        description: Number of entries per page
      - name: full
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, returns full rule details
      - name: userName
        in: query
        required: false
        schema:
          type: string
        description: Filter by user name
      - name: userAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without userName, matches default user rules
      - name: roleName
        in: query
        required: false
        schema:
          type: string
        description: Filter by role name
      - name: roleAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without roleName, matches default role rules
      - name: workspace
        in: query
        required: false
        schema:
          type: string
        description: Filter by workspace name
      - name: workspaceAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without workspace, matches default workspace rules
    post:
      operationId: post_geofence_AdminRulesRestController_insert
      summary: Create a new geofence admin rule
      description: >-
        Inserts a new admin rule. If a rule with the same priority already exists,
        existing rules are shifted to make room.
      tags:
      - Extensions
      responses:
        '201':
          description: Admin rule created successfully, returns the new rule ID
          content:
            application/json:
              schema:
                type: integer
                format: int64
                description: The ID of the newly created admin rule
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '409':
          description: Duplicate key - a rule with conflicting constraints already exists
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JaxbAdminRule'
            example:
              priority: 0
              userName: admin
              workspace: topp
              access: ADMIN
          application/xml:
            schema:
              $ref: '#/components/schemas/JaxbAdminRule'
  /rest/geofence/adminrules/count:
    get:
      operationId: get_geofence_AdminRulesRestController_count
      summary: Count geofence admin rules
      description: >-
        Returns the count of admin rules matching the specified filter criteria.
      tags:
      - Extensions
      responses:
        '200':
          description: Count of matching admin rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: userName
        in: query
        required: false
        schema:
          type: string
        description: Filter by user name
      - name: userAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without userName, matches default user rules
      - name: roleName
        in: query
        required: false
        schema:
          type: string
        description: Filter by role name
      - name: roleAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without roleName, matches default role rules
      - name: workspace
        in: query
        required: false
        schema:
          type: string
        description: Filter by workspace name
      - name: workspaceAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without workspace, matches default workspace rules
  /rest/geofence/adminrules/id/{id}:
    get:
      operationId: get_geofence_AdminRulesRestController_getById
      summary: Get a geofence admin rule by ID
      description: Returns a single admin rule identified by its numeric ID.
      tags:
      - Extensions
      responses:
        '200':
          description: The requested admin rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbAdminRule'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbAdminRule'
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: The admin rule ID
    post:
      operationId: post_geofence_AdminRulesRestController_update
      summary: Update a geofence admin rule
      description: >-
        Updates an existing admin rule. If the new priority conflicts with another rule,
        existing rules are shifted to make room.
      tags:
      - Extensions
      responses:
        '200':
          description: Admin rule updated successfully
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: The admin rule ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JaxbAdminRule'
          application/xml:
            schema:
              $ref: '#/components/schemas/JaxbAdminRule'
    delete:
      operationId: delete_geofence_AdminRulesRestController_delete
      summary: Delete a geofence admin rule
      description: Deletes an admin rule by its numeric ID.
      tags:
      - Extensions
      responses:
        '200':
          description: Admin rule deleted successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: The admin rule ID
  /rest/geofence/adminrules/move:
    get:
      operationId: get_geofence_AdminRulesRestController_move
      summary: Move admin rules to a new priority
      description: >-
        Move the provided admin rules to the target priority. Rules will be sorted by their
        current priority; the first rule gets the target priority and subsequent ones get
        incremented priority values. Existing rules at or below the target priority are shifted.
      tags:
      - Extensions
      responses:
        '200':
          description: Rules moved successfully, returns the updated rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbAdminRuleList'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: targetPriority
        in: query
        required: true
        schema:
          type: integer
        description: The target priority value for the first moved rule
      - name: rulesIds
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated list of admin rule IDs to move
  /rest/geofence/batch/exec:
    post:
      operationId: post_geofence_BatchRestController_exec
      summary: Execute a batch of geofence operations
      description: >-
        Executes a batch of rule and admin rule operations (insert, update, delete)
        in a single transactional request. All operations succeed or fail together.
      tags:
      - Extensions
      responses:
        '200':
          description: Batch executed successfully
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceBatch'
            example:
              operations:
              - service: rules
                type: insert
                payload:
                  priority: 0
                  access: ALLOW
                  workspace: topp
              - service: adminrules
                type: delete
                id: 5
          application/xml:
            schema:
              $ref: '#/components/schemas/GeofenceBatch'
  /rest/geofence/info:
    get:
      operationId: get_geofence_GeoFenceController_getInfo
      summary: Get geofence instance information
      description: Returns the configured GeoFence instance name.
      tags:
      - Extensions
      responses:
        '200':
          description: The GeoFence instance name
          content:
            text/plain:
              schema:
                type: string
                description: The configured GeoFence instance name
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/cache/info:
    get:
      operationId: get_geofence_CacheController_getCacheInfo_alt2
      summary: Get geofence rule cache statistics (alternate path)
      description: >-
        Returns cache statistics including size, hit count, miss count, load success/exception
        counts, total load time, and eviction count for all internal caches (RuleStats,
        AdminAuthStats, UserStats, ContStats). This is an alternate path equivalent to
        GET /rest/geofence/ruleCache/info.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache statistics as plain text
          content:
            text/plain:
              schema:
                type: string
                description: Multi-line cache statistics report
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/cache/invalidate:
    put:
      operationId: put_geofence_CacheController_invalidateCache_alt2
      summary: Invalidate the geofence rule cache (alternate path)
      description: >-
        Invalidates all entries in the GeoFence rule cache, forcing rules to be
        re-evaluated from the database on next access. This is an alternate path
        equivalent to PUT /rest/geofence/ruleCache/invalidate.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/ruleCache:
    put:
      operationId: put_geofence_CacheController_invalidateCache
      summary: Invalidate the geofence rule cache
      description: >-
        Invalidates all entries in the GeoFence rule cache, forcing rules to be
        re-evaluated from the database on next access.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/ruleCache/info:
    get:
      operationId: get_geofence_CacheController_getCacheInfo
      summary: Get geofence rule cache statistics
      description: >-
        Returns cache statistics including size, hit count, miss count, load success/exception
        counts, total load time, and eviction count for all internal caches (RuleStats,
        AdminAuthStats, UserStats, ContStats).
      tags:
      - Extensions
      responses:
        '200':
          description: Cache statistics as plain text
          content:
            text/plain:
              schema:
                type: string
                description: Multi-line cache statistics report
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/ruleCache/invalidate:
    put:
      operationId: put_geofence_CacheController_invalidateCache_path
      summary: Invalidate the geofence rule cache (alternate path)
      description: >-
        Alternate endpoint to invalidate all entries in the GeoFence rule cache.
        Equivalent to PUT /rest/geofence/ruleCache.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/ruleCache/info:
    get:
      operationId: get_geofence_CacheController_getCacheInfo_legacy
      summary: Get geofence rule cache statistics (legacy path)
      description: >-
        Returns cache statistics including size, hit count, miss count, load success/exception
        counts, total load time, and eviction count for all internal caches. This is a legacy
        path; prefer /rest/geofence/ruleCache/info.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache statistics as plain text
          content:
            text/plain:
              schema:
                type: string
                description: Multi-line cache statistics report
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/ruleCache/invalidate:
    put:
      operationId: put_geofence_CacheController_invalidateCache_legacy
      summary: Invalidate the geofence rule cache (legacy path)
      description: >-
        Invalidates all entries in the GeoFence rule cache, forcing rules to be
        re-evaluated from the database on next access. This is a legacy path;
        prefer PUT /rest/geofence/ruleCache/invalidate.
      tags:
      - Extensions
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
  /rest/geofence/rules:
    get:
      operationId: get_geofence_RulesRestController_get
      summary: List geofence access rules
      description: >-
        Returns a list of access rules, optionally filtered by user, role, instance,
        IP address, date, service, request, subfield, workspace, or layer.
        Rules control data access (ALLOW, DENY, LIMIT) to layers and services.
      tags:
      - Extensions
      responses:
        '200':
          description: List of rules matching the filter criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbRuleList'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbRuleList'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number for pagination (0-based)
      - name: entries
        in: query
        required: false
        schema:
          type: integer
        description: Number of entries per page
      - name: full
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, returns full rule details including limits and layer details
      - name: userName
        in: query
        required: false
        schema:
          type: string
        description: Filter by user name
      - name: userAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without userName, matches default user rules
      - name: roleName
        in: query
        required: false
        schema:
          type: string
        description: Filter by role name
      - name: roleAny
        in: query
        required: false
        schema:
          type: boolean
        description: When true without roleName, matches default role rules
      - name: instanceId
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Filter by GeoServer instance ID
      - name: instanceName
