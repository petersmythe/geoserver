    get:
      operationId: get_geofence_RulesRestController_move
      summary: Move access rules to a new priority
      description: >-
        Move the provided access rules to the target priority. Rules will be sorted by their
        current priority; the first rule gets the target priority and subsequent ones get
        incremented priority values. Existing rules at or below the target priority are shifted.
      tags:
      - Extensions
      responses:
        '200':
          description: Rules moved successfully, returns the updated rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JaxbRuleList'
            application/xml:
              schema:
                $ref: '#/components/schemas/JaxbRuleList'
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: targetPriority
        in: query
        required: true
        schema:
          type: integer
        description: The target priority value for the first moved rule
      - name: rulesIds
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated list of rule IDs to move
  /rest/imports:
    get:
      operationId: get_importer_ImportController_getImports
      summary: List all import contexts
      description: >-
        Returns a list of all import contexts. Each context represents a bulk data import
        operation with its current state, tasks, and configuration.
      tags:
      - Extensions - Importer
      responses:
        '200':
          description: List of import contexts
          content:
            application/json:
              schema: &id006
                type: object
            application/xml:
              schema: *id006
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: expand
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - self
          - all
          - '0'
          - '1'
          - '2'
          - '3'
        description: Controls the depth of sub-resource expansion in the JSON response. Use "none" (or 0) for minimal output
          with links only, "self" (or 1) to expand the current resource, "all" to fully expand all nested sub-resources, or
          an integer for a specific depth level. Default depth varies by endpoint (typically 0 for list operations).
    post:
      operationId: post_importer_ImportController_postImports_collection
      summary: Create a new import context
      description: >-
        Creates a new import context. Optionally configures a target workspace and/or store.
        If exec is true, the import is executed immediately after creation. If async is true,
        initialization and execution happen in the background.
      tags:
      - Extensions - Importer
      responses:
        '201':
          description: Import context created successfully
          content:
            application/json:
              schema:
                type: object
                description: The newly created import context
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: async
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: >-
          When true, the import is initialized and optionally executed asynchronously.
          The response returns immediately with the import context.
      - name: exec
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: >-
          When true, the import is executed immediately after creation.
          Combines create and run into a single request.
      requestBody:
        required: false
        description: >-
          Optional import context configuration specifying target workspace, store, and data source.
        content:
          application/json:
            schema:
              type: object
              description: Import context configuration
              properties:
                import:
                  type: object
                  properties:
                    targetWorkspace:
                      type: object
                      properties:
                        workspace:
                          type: object
                          properties:
                            name:
                              type: string
                    targetStore:
                      type: object
                      properties:
                        dataStore:
                          type: object
                          properties:
                            name:
                              type: string
            example:
              import:
                targetWorkspace:
                  workspace:
                    name: topp
                targetStore:
                  dataStore:
                    name: postgis_store
    delete:
      operationId: delete_importer_ImportController_deleteImports_all
      summary: Delete all import contexts
      description: >-
        Deletes all import contexts and their associated data. This is a bulk cleanup
        operation that removes every import context from the system.
      tags:
      - Extensions - Importer
      responses:
        '204':
          description: All import contexts deleted successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
