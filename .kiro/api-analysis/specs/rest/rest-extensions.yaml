              $ref: ../common/schemas.yaml#/ImportTransformPut

components:
  schemas:
    JaxbAdminRule:
      type: object
      description: >-
        A GeoFence admin rule that controls administrative access to workspaces.
        Admin rules grant ADMIN or USER level access.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier (read-only, assigned by server)
          readOnly: true
        priority:
          type: integer
          format: int64
          description: Rule priority (lower values = higher priority). Rules are evaluated in priority order.
        userName:
          type: string
          description: User name this rule applies to. Use '*' or omit for any user.
        roleName:
          type: string
          description: Role name this rule applies to. Use '*' or omit for any role.
        addressRange:
          type: string
          description: IP address range in CIDR notation (e.g., '192.168.1.0/24')
        workspace:
          type: string
          description: Workspace name this rule applies to. Use '*' or omit for any workspace.
        access:
          type: string
          enum:
          - ADMIN
          - USER
          description: The access level granted by this rule
      example:
        id: 1
        priority: 0
        userName: admin
        roleName: ROLE_ADMIN
        workspace: topp
        access: ADMIN

    JaxbAdminRuleList:
      type: object
      description: A list of admin rules or a count result
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/JaxbAdminRule'
        count:
          type: integer
          description: Total count of matching rules (returned by count endpoint)

    JaxbRule:
      type: object
      description: >-
        A GeoFence access rule that controls data access to layers and services.
        Rules can ALLOW, DENY, or LIMIT access based on user, role, service,
        request type, workspace, and layer.
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier (read-only, assigned by server)
          readOnly: true
        priority:
          type: integer
          format: int64
          description: Rule priority (lower values = higher priority). Rules are evaluated in priority order.
        userName:
          type: string
          description: User name this rule applies to. Use '*' or omit for any user.
        roleName:
          type: string
          description: Role name this rule applies to. Use '*' or omit for any role.
        addressRange:
          type: string
          description: IP address range in CIDR notation (e.g., '192.168.1.0/24')
        validAfter:
          type: string
          format: date
          description: Rule is valid only after this date (YYYY-MM-DD format)
        validBefore:
          type: string
          format: date
          description: Rule is valid only before this date (YYYY-MM-DD format)
        workspace:
          type: string
          description: Workspace name this rule applies to. Use '*' or omit for any workspace.
        layer:
          type: string
          description: Layer name this rule applies to. Use '*' or omit for any layer.
        service:
          type: string
          description: OGC service type (e.g., WMS, WFS, WCS). Use '*' or omit for any service.
        request:
          type: string
          description: OGC request type (e.g., GetMap, GetFeature). Use '*' or omit for any request.
        subfield:
          type: string
          description: Subfield for additional filtering
        access:
          type: string
          enum:
          - ALLOW
          - DENY
          - LIMIT
          description: The access grant type for this rule
        limits:
          $ref: '#/components/schemas/RuleLimits'
        layerDetails:
          $ref: '#/components/schemas/LayerDetails'
      example:
        id: 1
        priority: 0
        userName: admin
        roleName: ROLE_ADMIN
        workspace: topp
        layer: states
        service: WMS
        request: GetMap
        access: ALLOW

    JaxbRuleList:
      type: object
      description: A list of access rules or a count result
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/JaxbRule'
        count:
          type: integer
          description: Total count of matching rules (returned by count endpoint)

    RuleLimits:
      type: object
      description: Spatial and catalog mode limits for LIMIT-type rules
      properties:
        allowedArea:
          type: string
          description: >-
            WKT MultiPolygon defining the allowed area, optionally prefixed with
            SRID (e.g., 'SRID=4326;MULTIPOLYGON(((...)...))')
        catalogMode:
          type: string
          enum:
          - HIDE
          - MIXED
          - CHALLENGE
          description: >-
            How restricted layers appear in capabilities documents.
            HIDE removes them, MIXED shows accessible ones, CHALLENGE prompts for credentials.
        spatialFilterType:
          type: string
          enum:
          - INTERSECT
          - CLIP
          description: >-
            How the allowed area is applied. INTERSECT filters features intersecting
            the area, CLIP clips geometries to the area boundary.

    LayerDetails:
      type: object
      description: Fine-grained layer access details for non-LIMIT rules
      properties:
        layerType:
          type: string
          enum:
          - VECTOR
          - RASTER
          - LAYERGROUP
          description: The type of layer
        defaultStyle:
          type: string
          description: Default style name to use for this layer
        cqlFilterRead:
          type: string
          description: CQL filter applied to read (GetMap/GetFeature) requests
        cqlFilterWrite:
          type: string
          description: CQL filter applied to write (WFS-T) requests
        allowedArea:
          type: string
          description: WKT MultiPolygon defining the allowed area (with optional SRID prefix)
        spatialFilterType:
          type: string
          enum:
          - INTERSECT
          - CLIP
          description: How the allowed area is applied
        catalogMode:
          type: string
          enum:
          - HIDE
          - MIXED
          - CHALLENGE
          description: How the layer appears in capabilities
        allowedStyles:
          type: array
          items:
            type: string
          description: List of allowed style names for this layer
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/LayerAttribute'
          description: Per-attribute access control

    LayerAttribute:
      type: object
      description: Per-attribute access control for vector layers
      properties:
        name:
          type: string
          description: The attribute (field) name
        dataType:
          type: string
          description: The data type of the attribute (e.g., String, Integer, Geometry)
        accessType:
          type: string
          enum:
          - NONE
          - READONLY
          - READWRITE
          description: >-
            Access level for this attribute. NONE hides it, READONLY allows read access,
            READWRITE allows both read and write access.

    GeofenceBatch:
      type: object
      description: >-
        A batch of GeoFence operations to execute atomically. All operations
        succeed or fail together within a single transaction.
      properties:
        operations:
          type: array
          description: List of batch operations to execute in order
          items:
            $ref: '#/components/schemas/GeofenceBatchOperation'
      example:
        operations:
        - service: rules
          type: insert
          payload:
            priority: 0
            access: ALLOW
            workspace: topp
            layer: states
        - service: adminrules
          type: delete
          id: 5

    GeofenceBatchOperation:
      type: object
      description: A single operation within a GeoFence batch
      properties:
        service:
          type: string
          enum:
          - rules
          - adminrules
          description: The target service for this operation
        type:
          type: string
          enum:
          - insert
          - update
          - delete
          description: The operation type
        id:
          type: integer
          format: int64
          description: The rule ID (required for update and delete operations)
        payload:
          type: object
          description: >-
            The rule payload. Must be a JaxbRule object when service is 'rules',
            or a JaxbAdminRule object when service is 'adminrules'.
            Required for insert and update operations.
