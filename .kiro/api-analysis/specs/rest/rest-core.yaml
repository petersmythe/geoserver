          description: Resource deleted successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: workspaceName
        in: path
        required: true
        schema:
          type: string
        description: The name of the workspace
      - name: storeName
        in: path
        required: true
        schema:
          type: string
        description: The name of the coverage store
      - name: coverageName
        in: path
        required: true
        schema:
          type: string
        description: The name of the coverage
      - name: templateName
        in: path
        required: true
        schema:
          type: string
        description: The name of the template (without .ftl extension)
  /rest/resource/{path}:
    get:
      operationId: get_rest_ResourceController_resourceGet_path
      summary: Get a resource by path
      description: >-
        Returns the contents or metadata of a resource at the given path within
        the GeoServer data directory. The operation parameter controls what is returned.
      tags:
      - Core
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: Resource metadata or directory listing
            application/xml:
              schema:
                type: object
                description: Resource metadata or directory listing
            '*/*':
              schema:
                type: string
                format: binary
                description: Raw resource content
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Path to the resource within the data directory
      - name: operation
        in: query
        required: false
        schema:
          type: string
          enum: [default, metadata]
          default: default
        description: >-
          Controls what is returned. 'default' returns resource content or
          directory listing, 'metadata' returns resource metadata.
      - name: format
        in: query
        required: false
        schema:
          type: string
          default: text/html
        description: Output format for metadata or directory listings
    put:
      operationId: put_rest_ResourceController_resourcePut_path
      summary: Upload or modify a resource
      description: >-
        Creates or updates a resource at the given path. Supports copy and move
        operations via the operation parameter.
      tags:
      - Core
      responses:
        '200':
          description: Resource updated successfully
        '201':
          description: Resource created successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '405':
          description: Method not allowed (e.g., writing to a directory)
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Path to the resource within the data directory
      - name: operation
        in: query
        required: false
        schema:
          type: string
          enum: [default, copy, move]
          default: default
        description: >-
          Controls the operation. 'default' uploads content, 'copy' duplicates
          a resource (path in body) to this location, 'move' moves a resource
          (path in body) to this location.
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
              description: Resource content or source path for copy/move
    delete:
      operationId: delete_rest_ResourceController_resourceDelete_path
      summary: Delete a resource
      description: Deletes a resource at the given path within the data directory.
      tags:
      - Core
      responses:
        '200':
          description: Resource deleted successfully
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Path to the resource within the data directory