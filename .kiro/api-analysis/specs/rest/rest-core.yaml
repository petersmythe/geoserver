  /rest/crs:
    get:
      operationId: get_rest_CRSController_list
      summary: List supported CRS codes
      description: Returns a paginated list of supported Coordinate Reference System codes, optionally filtered by authority and/or search query.
      tags:
      - Core
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  crs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The CRS identifier (e.g. EPSG:4326)
                        href:
                          type: string
                          description: Link to the CRS WKT definition
                  page:
                    type: object
                    properties:
                      offset:
                        type: integer
                      limit:
                        type: integer
                      returned:
                        type: integer
                      total:
                        type: integer
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: authority
        in: query
        required: false
        schema:
          type: string
        description: Filter by CRS authority (e.g. EPSG, IAU)
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: Search query to filter CRS codes by identifier
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
        description: Pagination offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: Maximum number of results to return (max 200)
  /rest/crs/authorities:
