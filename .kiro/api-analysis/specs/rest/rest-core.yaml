      description: Returns the Well-Known Text (WKT) representation of the specified CRS.
      tags:
      - Core
      responses:
        '200':
          description: Successful operation
          content:
            text/plain:
              schema:
                type: string
                description: WKT representation of the CRS
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
          $ref: ../common/responses.yaml#/Forbidden
        '404':
          $ref: ../common/responses.yaml#/NotFound
        '500':
          $ref: ../common/responses.yaml#/InternalServerError
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
        description: The CRS identifier (e.g. EPSG:4326)
  /rest/crs/{identifier}.json:
    get:
      operationId: get_rest_CRSController_getJson
      summary: Get CRS definition as JSON
      description: Returns the CRS definition including identifier, name, bounding box, and WKT definition in JSON format.
      tags:
      - Core
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The CRS identifier
                  format:
                    type: string
                    description: The definition format (wkt)
                  name:
                    type: string
                    description: Human-readable name of the CRS
                  bbox:
                    type: object
                    description: Bounding box in native CRS units
                    properties:
                      minX:
                        type: number
                      minY:
                        type: number
                      maxX:
                        type: number
                      maxY:
                        type: number
                  bboxWGS84:
                    type: object
                    description: Bounding box in WGS84 (EPSG:4326)
                    properties:
                      minX:
                        type: number
                      minY:
                        type: number
                      maxX:
                        type: number
                      maxY:
                        type: number
                  definition:
                    type: string
                    description: WKT definition of the CRS
        '400':
          $ref: ../common/responses.yaml#/BadRequest
        '401':
          $ref: ../common/responses.yaml#/Unauthorized
        '403':
